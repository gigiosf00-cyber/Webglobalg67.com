<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idrotherapy - Anti-Aging & Wrinkle Reducer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #212529;
            line-height: 1.6;
            padding: 15px 10px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9ecef;
        }
        .badge {
            display: inline-block;
            background-color: #e6f4ea;
            color: #137333;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        h1 {
            font-size: 22px;
            line-height: 1.3;
            color: #111111;
            margin-bottom: 12px;
            font-weight: 800;
            text-align: center;
        }
        .subtitle {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 22px;
            text-align: center;
        }
        .benefits-list {
            list-style: none;
            margin-bottom: 22px;
            padding: 0 5px;
        }
        .benefits-list li {
            font-size: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: #333333;
        }
        .benefits-list li span {
            color: #00a8ff;
            font-weight: bold;
            font-size: 16px;
        }

        /* LINK CLICÁVEL ENVOLVENDO A CAIXA DE GARANTIA */
        .guarantee-link {
            text-decoration: none;
            color: inherit;
            display: block;
            margin: 22px 0 16px 0;
        }

        .guarantee-box {
            background: #fffdf4;
            border: 2px solid #e2b13c;
            border-radius: 12px;
            padding: 18px 16px;
            text-align: center;
            color: #333333;
            transition: transform 0.2s ease;
        }

        .guarantee-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .guarantee-header h3 {
            color: #111111;
            font-size: 15px;
            font-weight: 800;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .guarantee-box p {
            font-size: 13.5px;
            line-height: 1.45;
            margin: 0;
            color: #444444;
        }

        /* ANIMAÇÃO DE PULSAR (PULSE GLOW) */
        .pulse-animation {
            animation: pulse-glow 2.2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(226, 177, 60, 0.4);
            }
            50% {
                transform: scale(1.025);
                box-shadow: 0 0 18px 6px rgba(226, 177, 60, 0.55);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(226, 177, 60, 0);
            }
        }

        /* BOTÃO CTA PRINCIPAL */
        .btn-cta {
            display: block;
            width: 100%;
            background-color: #00a8ff;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 14px rgba(0, 168, 255, 0.4);
            transition: all 0.2s ease;
        }

        .btn-cta:hover, .btn-cta:active {
            background-color: #008cdb;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 168, 255, 0.5);
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 11px;
            color: #888888;
            line-height: 1.5;
        }
        footer a {
            color: #666666;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="text-align: center;">
            <span class="badge">Official Special Offer</span>
        </div>

        <h1>POV: You Finally Fixed Your Dull & Aging Skin</h1>
        
        <p class="subtitle">Discover how Idrotherapy deeply hydrates, targets deep wrinkles, and restores that youthful, radiant glow.</p>
